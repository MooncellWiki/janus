[package]
name = "janus"
version = "0.3.2"
edition = "2024"

[[bin]]
name = "janus"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
tokio = { version = "1.53.1", features = [
  "signal",
  "rt-multi-thread",
  "macros",
  "time",
] }
async-trait = "0.1.91"
tracing = "0.1.44"
chrono = "0.4.45"
clap = { version = "4.6.6", features = [ "derive" ] }
axum = { version = "0.8.9", features = [
  "macros",
  "multipart"
] }
bytes = { version = "1.12.1" }
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "json"
] }
anyhow = "1.0.104"
tower-http = { version = "0.7.0", features = [
  "timeout",
  "trace",
  "cors",
  "compression-full",
  "fs",
  "set-header",
] }
thiserror = "2.0.19"
toml = "1.1.4"
utoipa = { version = "5.5.0", features = [
  "debug",
  "axum_extras"
] }
utoipa-axum = { version = "0.2.0", features = [ "debug" ] }
utoipa-scalar = { version = "0.3.0", features = [ "axum" ] }
sentry = { version = "0.49.1", features = [
  "tracing",
  "tower",
  "tower-axum-matched-path",
  "tower-http",
] }
tower = "0.5.3"
futures = "0.3.33"
mimalloc = "0.1.52"
serde_variant = "0.1.3"
reqwest = { version = "0.13.4", features = ["json", "multipart"] }
rand = "0.10.2"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
sha2 = "0.11.0"
hmac = "0.13.0"
percent-encoding = "2.3.2"

[workspace.metadata.release]
publish = false
tag-prefix = ""
shared-version = true
pre-release-commit-message = "chore: Release {{version}}"
# Don't talk to crates.io https://github.com/crate-ci/cargo-release/pull/735
registry = ""
pre-release-hook = [
  "just",
  "pre-release",
  "{{version}}"
]
