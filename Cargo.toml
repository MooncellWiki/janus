[package]
name = "janus"
version = "0.4.0"
edition = "2024"

[[bin]]
name = "janus"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
tokio = { version = "1.54.0", features = [
  "signal",
  "rt-multi-thread",
  "macros",
  "time",
] }
async-trait = "0.1.92"
tracing = "0.1.44"
chrono = "0.4.45"
clap = { version = "4.6.7", features = [ "derive" ] }
axum = { version = "0.8.9", features = [
  "macros",
  "multipart"
] }
bytes = { version = "1.12.1" }
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "json"
] }
anyhow = "1.0.104"
tower-http = { version = "0.7.1", features = [
  "timeout",
  "trace",
  "cors",
  "compression-full",
  "fs",
  "set-header",
] }
thiserror = "2.0.21"
toml = "1.1.8"
utoipa = { version = "6.0.0", features = [
  "debug",
  "axum_extras"
] }
utoipa-axum = { version = "0.3.0", features = [ "debug" ] }
utoipa-scalar = { version = "0.4.0", features = [ "axum" ] }
sentry = { version = "0.49.3", features = [
  "tracing",
  "tower",
  "tower-axum-matched-path",
  "tower-http",
] }
tower = "0.5.3"
futures = "0.3.34"
mimalloc = "0.1.52"
serde_variant = "0.1.3"
reqwest = { version = "0.13.5", features = ["json", "multipart"] }
rand = "0.10.3"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
sha2 = "0.11.1"
hmac = "0.13.0"
percent-encoding = "2.3.2"

[workspace.metadata.release]
publish = false
tag-prefix = ""
shared-version = true
pre-release-commit-message = "chore: Release {{version}}"
# Don't talk to crates.io https://github.com/crate-ci/cargo-release/pull/735
registry = ""
pre-release-hook = [
  "just",
  "pre-release",
  "{{version}}"
]
